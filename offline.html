<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <title>Offline - Quant Radar</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            background: #000000;
            color: #cccccc;
            font-family: "IBM Plex Mono", "Courier New", monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        p {
            font-size: 13px;
            color: #555555;
            letter-spacing: 1px;
            margin-bottom: 8px;
            max-width: 400px;
        }

        .status {
            margin-top: 32px;
            padding: 16px 24px;
            background: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 4px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .retry-btn {
            margin-top: 24px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #000000;
            background: #ff8c00;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .retry-btn:hover {
            background: #ffaa33;
        }

        footer {
            position: fixed;
            bottom: 24px;
            font-size: 11px;
            color: #2a2a2a;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Quant Radar requires an internet connection to display the latest market data.</p>
    <p>Check your connection and try again.</p>

    <div class="status">
        <span class="status-dot"></span>
        <span style="color: #444444;">Waiting for connection...</span>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">Retry</button>

    <footer>© 2026 Quant Radar System</footer>

    <script>
        // Auto-reload when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Check connection status periodically
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
