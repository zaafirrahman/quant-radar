                <link rel="icon" type="image/png" href="../../../../assets/logo.png"><title>Tracker Matrix</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "IBM Plex Mono", "Cascadia Code", monospace;
    background: #000000;
    color: #cccccc;
    padding: 36px;
}

h2 {
    font-size: 28px;
    letter-spacing: 5px;
    color: #ffffff;
    font-weight: bold;
    margin-bottom: 6px;
    text-transform: uppercase;
    text-align: left;
}

.subtitle {
    text-align: left;
    color: #555555;
    font-size: 13px;
    margin-bottom: 28px;
    letter-spacing: 1px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #0a0a0a;
    border: 1px solid #222222;
}

th {
    background: #111111;
    color: #ffffff;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 14px;
    border-bottom: 1px solid #333333;
    border-right: 1px solid #1a1a1a;
    font-weight: 400;
}

th:last-child { border-right: none; }

td {
    padding: 12px 14px;
    border-bottom: 1px solid #1a1a1a;
    border-right: 1px solid #141414;
    font-size: 15px;
}

td:last-child  { border-right: none; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #111111; }

tr.top5 td { background: #0d0d0d; }
tr.top5:hover td { background: #161616; }

.nav-btn {
    position: fixed;
    top: 24px;
    right: 28px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #000000;
    background: #ff8c00;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    text-decoration: none;
    z-index: 999;
    transition: background 0.15s ease;
}
.nav-btn:hover { background: #ffaa33; }

/* ── STICKY TABLE WRAPPER ── */
.table-wrap {
    overflow-x: auto;
    overflow-y: auto;
    max-height: calc(100vh - 220px);
    position: relative;
}

/* Freeze col 1 (Rank) */
.sticky-table th:nth-child(1),
.sticky-table td:nth-child(1) {
    position: sticky;
    left: 0;
    z-index: 2;
    background: #111111;
    min-width: 50px;
}
.sticky-table td:nth-child(1) { background: #0a0a0a; }
tr.top5 .sticky-table td:nth-child(1),
.sticky-table tr.top5 td:nth-child(1) { background: #0d0d0d; }

/* Freeze col 2 (Ticker) */
.sticky-table th:nth-child(2),
.sticky-table td:nth-child(2) {
    position: sticky;
    left: 50px;
    z-index: 2;
    background: #111111;
    min-width: 80px;
    border-right: 1px solid #333333;
}
.sticky-table td:nth-child(2) { background: #0a0a0a; }
.sticky-table tr.top5 td:nth-child(2) { background: #0d0d0d; }

/* Freeze header row */
.sticky-table thead th {
    position: sticky;
    top: 0;
    z-index: 3;
}
.sticky-table thead th:nth-child(1) { z-index: 4; }
.sticky-table thead th:nth-child(2) { z-index: 4; }
</style></head><body>
